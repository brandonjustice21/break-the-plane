name: Hourly live refresh

# Replicates RotoBombs' hourly-cron pattern for Break the Plane: no
# RotoWire scraping, no re-fitting the model -- just re-pulling live inputs
# (ESPN injuries, OpticOdds game lines + Anytime TD odds) and re-running the
# already-fitted formula chain (see refresh_live.py / model_constants_2026.json)
# to produce a fresh data.json. Vercel's static hosting picks up the new
# data.json on push with no rebuild needed -- the page fetches it at runtime.
#
# GitHub Actions' free tier gives hourly cron for free (unlike Vercel Hobby,
# capped at once/day) -- see refresh-runbook.md for the full comparison.

on:
  schedule:
    # Every hour, at :07 past -- offset from the top of the hour so this
    # doesn't line up with everyone else's :00 cron and hit GitHub's queue
    # at its busiest moment. GitHub Actions cron is best-effort, not exact.
    - cron: "7 * * * *"
  workflow_dispatch: {}  # lets Wallace trigger a refresh on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live refresh
        env:
          ODDSJAM_KEY: ${{ secrets.ODDSJAM_KEY }}
          BTP_ND: ${{ github.workspace }}/data/nflverse
          BTP_OUT: ${{ github.workspace }}/data
          BTP_SITE: ${{ github.workspace }}
        run: python3 refresh_live.py --week 3

      - name: Commit data.json if changed
        run: |
          git config user.name "break-the-plane-bot"
          git config user.email "actions@users.noreply.github.com"

          if git diff --quiet -- data.json; then
            echo "No change in data.json this run -- nothing to commit."
            exit 0
          fi

          # Stash the freshly computed file itself (not a git ref) so we can
          # reapply it no matter how many times we have to resync below.
          cp data.json /tmp/data.json.new

          for attempt in 1 2 3 4 5; do
            git add data.json
            git commit -m "Hourly live refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"

            if git push; then
              echo "Pushed successfully on attempt $attempt."
              exit 0
            fi

            echo "Push rejected on attempt $attempt (someone else pushed to main in the meantime) -- resyncing and retrying..."
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/data.json.new data.json

            if git diff --quiet -- data.json; then
              echo "Latest main already has this exact data.json (someone else's run beat us to the same content) -- nothing left to push."
              exit 0
            fi
          done

          echo "Failed to push data.json after 5 attempts -- giving up this run; next hourly run will retry."
          exit 1
