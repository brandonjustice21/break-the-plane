<title>Break the Plane — Week 1</title>
<style>
:root{
  --bg:#000D1A; --card:#001428; --border:#04203C; --border2:#0B3054;
  --red:#F22E45; --turf:#00E657; --ketchup:#FF4537; --teal:#00D4AA; --gold:#F5A623; --volt:#BAED00;
  --n2:#fff; --n3:#A9BDD2; --n4:#7B94AF; --n5:#4F6E8F; --n6:#2A4E74;
  --font-display:'Integral CF','Arial Black',sans-serif;
  --font-body:'Cosmica',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-data:ui-monospace,Menlo,'SF Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--n2);font-family:var(--font-body);min-height:100%}
body{padding:22px 14px 60px}
a{color:#F87C8D}
a:hover{color:#F55368}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.wrap{max-width:820px;margin:0 auto}
.shell{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--border);line-height:1.4}

/* provenance banner */
.provenance{background:linear-gradient(90deg,rgba(245,166,35,.14),rgba(245,166,35,.03));border:1px solid rgba(245,166,35,.4);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#F0D9A8;line-height:1.55}
.provenance b{color:var(--gold)}

/* header */
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px}
.wordmark{line-height:.9}
.wordmark small{display:block;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--n3);font-weight:600}
.wordmark b{font-family:var(--font-display);font-style:italic;font-size:19px;letter-spacing:.01em;color:var(--n2)}
.badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-family:var(--font-data);font-size:9.5px;letter-spacing:.06em;padding:3px 8px;border-radius:5px;white-space:nowrap}
.badge.demo{color:var(--turf);background:rgba(0,230,87,.12);border:1px solid rgba(0,230,87,.4)}
.badge.week{color:#F87C8D;background:rgba(242,46,69,.12);border:1px solid rgba(168,0,33,.6);border-radius:999px}

/* hero */
.hero{position:relative;overflow:hidden;padding:18px 18px 16px;background:radial-gradient(130% 150% at 100% 0%,rgba(242,46,69,.22),#001428 55%,#000 110%);border-bottom:1px solid var(--border)}
.eyebrow{font-family:var(--font-data);font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
.hero-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.avatar{border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:linear-gradient(165deg,#2A4E74,#001428);border:2px solid #4F6E8F}
.avatar span{font-family:var(--font-display);color:#fff;opacity:.85}
.hero-name{font-family:var(--font-display);font-size:clamp(21px,4.4vw,30px);text-transform:uppercase;line-height:.95;color:#fff;letter-spacing:.01em;text-wrap:balance}
.chip-team{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;font-family:var(--font-data);font-weight:700;font-size:10.5px;padding:2px 6px;background:var(--border);border:1px solid var(--n6);color:var(--n3)}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--n3);font-family:var(--font-data)}
.pos{font-family:var(--font-data);font-weight:600;font-size:9.5px;letter-spacing:.06em;padding:2px 7px;border-radius:4px}
.grade{font-family:var(--font-display);font-size:11px;padding:2px 9px;border-radius:999px}
.signals{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.sig{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600;white-space:nowrap}

/* controls */
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px 4px}
.seg{display:inline-flex;background:#001428;border:1px solid var(--border2);border-radius:7px;padding:2px;gap:2px}
.seg button{padding:5px 11px;border-radius:5px;border:none;cursor:pointer;font-weight:600;font-size:11.5px;background:transparent;color:var(--n4);transition:all .15s;white-space:nowrap}
.seg button.on{background:var(--red);color:#fff}
.sortlbl{font-family:var(--font-data);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--n4)}
.count{margin-left:auto;font-family:var(--font-data);font-size:10.5px;color:var(--n5)}

/* filter chip bar */
.filterbar{display:flex;flex-wrap:wrap;gap:6px;padding:2px 16px 12px;border-bottom:1px solid var(--border)}
.fchip{font-family:var(--font-data);font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:5px 10px;border-radius:999px;border:1px solid var(--border2);background:#001428;color:var(--n4);cursor:pointer;white-space:nowrap;transition:all .15s}
.fchip:hover{border-color:var(--n5);color:var(--n3)}
.fchip.on{background:var(--red);border-color:var(--red);color:#fff}
.fchip.watch{margin-left:auto}
.fchip.watch.on{background:var(--gold);border-color:var(--gold);color:#001428}

/* list / cards */
.list{padding:10px 12px 4px}
.pcard{position:relative;background:#001428;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;transition:border-color .2s}
.pcard:hover{border-color:var(--border2)}
.pcard.open{border-color:#2A4E74}
.chead{display:flex;align-items:center;gap:12px;padding:11px 13px;cursor:pointer;width:100%;background:none;border:none;text-align:left;color:inherit}
.rank{font-family:var(--font-display);font-size:13px;color:var(--n6);width:22px;text-align:center;flex-shrink:0}
.score{font-family:var(--font-display);font-size:20px;width:48px;text-align:center;flex-shrink:0;line-height:1}
.score small{display:block;font-family:var(--font-data);font-size:8px;letter-spacing:.08em;color:var(--n5);margin-top:3px;font-weight:400}
.pname{font-weight:700;font-size:14.5px;color:#fff;letter-spacing:-.01em}
.sub{font-size:11px;color:var(--n4);font-family:var(--font-data);margin-top:2px}
.right{margin-left:auto;text-align:right;flex-shrink:0}
.hit{font-family:var(--font-data);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px}
.caret{color:var(--n6);font-size:11px;margin-left:8px;flex-shrink:0}
.sigrow{display:flex;flex-wrap:wrap;gap:5px;padding:0 13px 11px}
.sharebar{display:flex;height:5px;border-radius:999px;overflow:hidden;background:var(--n6);margin-top:6px;max-width:170px}
.sb-seg{height:100%}

/* watchlist star */
.starbtn{width:26px;height:26px;border-radius:50%;border:1px solid var(--border2);background:rgba(0,20,40,.85);color:var(--n5);font-size:14px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:all .15s;flex-shrink:0}
.starbtn:hover{border-color:var(--gold);color:var(--gold)}
.starbtn.on{color:var(--gold);border-color:var(--gold);background:rgba(245,166,35,.16)}
.starbtn.abs{position:absolute;top:9px;right:9px;z-index:5}

/* detail */
.detail{padding:13px 14px 15px;border-top:1px solid var(--border);display:grid;gap:13px}
.dlbl{font-family:var(--font-data);font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--n4);margin-bottom:7px}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--border);border:1px solid var(--border2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:var(--n3)}
.legend i{width:7px;height:7px;border-radius:2px;display:inline-block}
.envgrid{display:flex;gap:12px;flex-wrap:wrap}
.envgrid>div{flex:1 1 100px;min-width:100px;background:#000D1A;border:1px solid var(--border2);border-radius:8px;padding:9px 11px}
.envgrid b{font-family:var(--font-display);font-size:16px;font-weight:400;display:block;margin-top:2px;color:#fff}
.envgrid i{font-style:normal;font-family:var(--font-data);font-size:9.5px;color:var(--n5);display:block;margin-top:2px}
.calib-box{border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:12px;border:1px solid}
.ctx{font-size:11.5px;color:#CFDCEA;line-height:1.55;padding:9px 12px;border-radius:8px;background:rgba(242,46,69,.08);border:1px solid rgba(168,0,33,.55)}
.due-note{font-size:10.5px;color:var(--n4);line-height:1.5}
.watchbtn{justify-self:start;font-family:var(--font-data);font-size:11px;font-weight:600;padding:8px 16px;border-radius:999px;border:1px solid var(--border2);background:#000D1A;color:var(--n3);cursor:pointer;transition:all .15s}
.watchbtn:hover{border-color:var(--gold);color:var(--gold)}
.watchbtn.on{background:rgba(245,166,35,.14);border-color:var(--gold);color:var(--gold)}

/* table */
.tablewrap{margin:10px 12px 4px;background:#001428;border:1px solid var(--border2);border-radius:10px;overflow-x:auto}
table.ptable{width:100%;border-collapse:collapse;min-width:720px}
.ptable th{padding:9px 10px;text-align:left;font-family:var(--font-data);font-weight:600;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--n5);background:var(--border);border-bottom:1px solid var(--border2);white-space:nowrap}
.ptable td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;color:var(--n3);white-space:nowrap}
.ptable tr.prow{cursor:pointer}
.ptable tr.prow:hover td{background:rgba(255,255,255,.03)}

/* by-game */
.gamecard{background:#001428;border:1px solid var(--border2);border-radius:10px;margin:0 12px 10px;overflow:hidden}
.gamehead{display:flex;align-items:center;gap:9px;padding:10px 13px;background:linear-gradient(90deg,rgba(242,46,69,.10),#001428);border-bottom:1px solid var(--border);flex-wrap:wrap;font-family:var(--font-data);font-size:11px;color:var(--n3)}
.gamerow{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-radius:8px;width:100%;background:none;border:none;text-align:left;color:inherit}
.gamerow:hover{background:rgba(255,255,255,.03)}

.foot{padding:12px 16px 14px;font-family:var(--font-data);font-size:9.5px;letter-spacing:.03em;color:var(--n6);text-align:center;line-height:1.6}
.foot a{color:var(--n5)}
.empty{padding:40px 20px;text-align:center;color:var(--n5);font-size:13px}

/* legend / onboarding banner */
.legend-banner{display:flex;align-items:flex-start;gap:10px;padding:9px 16px;font-size:11px;color:var(--n3);background:rgba(0,212,170,.06);border-bottom:1px solid var(--border);line-height:1.5}
.legend-banner b{color:#fff}
.legend-text{flex:1 1 auto;min-width:0}
.legend-dismiss{margin-left:auto;flex-shrink:0;font-family:var(--font-data);font-size:10px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--border2);background:transparent;color:var(--n4);cursor:pointer;white-space:nowrap}
.legend-dismiss:hover{color:var(--n3);border-color:var(--n5)}

/* storyline banner */
.storyline{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 16px;font-size:11.5px;color:var(--n3);border-bottom:1px solid var(--border);background:rgba(186,237,0,.05)}
.storytag{font-family:var(--font-data);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--volt);background:rgba(186,237,0,.14);border:1px solid rgba(186,237,0,.4);padding:3px 8px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.storyname{font-weight:700;color:#fff}
.storynote{color:var(--n4)}

/* sticky controls */
.stickywrap{position:sticky;top:0;z-index:10;background:var(--card)}

/* search box */
.searchwrap{position:relative;flex:1 1 150px;min-width:120px}
.searchbox{width:100%;background:#001428;border:1px solid var(--border2);border-radius:7px;padding:6px 10px 6px 28px;font-size:12px;color:#fff;font-family:inherit}
.searchbox::placeholder{color:var(--n5)}
.searchwrap svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);pointer-events:none}

/* filter groups */
.filterbar{display:flex;flex-direction:column;gap:8px;padding:8px 16px 12px;border-bottom:1px solid var(--border)}
.filterrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filtergroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filtergroup-lbl{font-family:var(--font-data);font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--n5);width:100%;margin-top:4px}
.morefilters{font-family:var(--font-data);font-size:10.5px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px dashed var(--border2);background:transparent;color:var(--n4);cursor:pointer;white-space:nowrap}
.morefilters:hover{color:var(--n3);border-color:var(--n5)}
.moregroups{display:flex;flex-direction:column;gap:6px;padding-top:4px;border-top:1px dashed var(--border2)}

/* edge badge on collapsed card */
.edgebadge{font-family:var(--font-data);font-size:10px;padding:2px 7px;border-radius:999px;font-weight:700}

/* table column hide on narrow screens, scroll affordance */
.tablewrap{position:relative}
.tablewrap::after{content:'';position:absolute;top:0;right:0;bottom:0;width:22px;background:linear-gradient(90deg,transparent,var(--card));pointer-events:none}
@media (max-width:480px){
  .rank{display:none}
  .avatar.sm{display:none}
  .envgrid>div{flex:1 1 44%}
  .colhide-sm{display:none}
  /* The collapsed card row's kickoff-time badge (.right) doesn't shrink, which at
     narrow widths was squeezing the player name/sub column down to almost nothing
     -- "@ IND · O/U 47.5" was wrapping one token per line. That kickoff time is
     already shown in the expanded detail panel, so on small screens it's safe to
     drop from the collapsed row entirely and give the name column the room. */
  .right{display:none}
  .chead{gap:8px}
}
</style>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function pct(v){return v==null?'—':Math.round(v*100)+'%';}
function grade(p){ // grade bands set from this build's own decile calibration table, not invented
  if(p>=.45) return ['A+',C.red];
  if(p>=.30) return ['A',C.turf];
  if(p>=.20) return ['B',C.teal];
  if(p>=.12) return ['C',C.gold];
  return ['D',C.n4];
}
function initials(name){return name.split(' ').filter(Boolean).map(function(w){return w[0];}).slice(0,2).join('');}
function avatar(p,size,cls){
  if(p.headshot){
    return '<span class="avatar '+(cls||'')+'" style="width:'+size+'px;height:'+size+'px;padding:0;overflow:hidden">'+
      '<img src="'+p.headshot+'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%" /></span>';
  }
  return '<span class="avatar '+(cls||'')+'" style="width:'+size+'px;height:'+size+'px">'+
    '<span style="font-size:'+Math.round(size*.32)+'px">'+esc(initials(p.name))+'</span></span>';
}
function teamChip(t){return '<span class="chip-team">'+esc(t)+'</span>';}
function posBadge(p){var c=POSC[p]||C.n4;return '<span class="pos" style="color:'+c+';background:'+c+'26;border:1px solid '+c+'55">'+p+'</span>';}
function gradePill(p){var g=grade(p);return '<span class="grade" style="color:'+g[1]+';background:'+g[1]+'22;border:1px solid '+g[1]+'66">'+g[0]+'</span>';}
function defTierChip(p){
  if(p.def_tier==null) return '';
  var c=DEFCOLOR[p.def_tier]||C.n4;
  var label = p.def_tier==='Worst' ? 'vs Worst D' : p.def_tier==='Elite' ? 'vs Elite D' : 'vs '+p.def_tier+' D';
  return '<span class="sig" style="color:'+c+';background:'+c+'1f;border:1px solid '+c+'4d">'+label+'</span>';
}
function envChip(p){
  if(p.lambda_team==null) return '';
  var hot = p.lambda_team>=2.8;
  var c = hot?C.volt:C.n4;
  return '<span class="sig" style="color:'+c+';background:'+c+'1f;border:1px solid '+c+'4d">Team proj '+p.lambda_team.toFixed(1)+' TDs</span>';
}
function dueChip(p){
  if(p.games_since_td==null) return '';
  if(p.games_since_td===0) return IS_SEASON_OPENER ? '' : '<span class="sig" style="color:'+C.turf+';background:'+C.turf+'1f;border:1px solid '+C.turf+'4d">Scored last week</span>';
  if(p.games_since_td>=3) return '<span class="sig" style="color:'+C.gold+';background:'+C.gold+'1f;border:1px solid '+C.gold+'4d">'+p.games_since_td+' gms since TD</span>';
  return '';
}
function hotChip(p){
  if(!p.tds_in_last4 || p.tds_in_last4<3) return '';
  return '<span class="sig" style="color:'+C.red+';background:'+C.red+'1f;border:1px solid '+C.red+'4d">🔥 '+p.tds_in_last4+' TDs in L4</span>';
}
function volumeChip(p){
  var ts=p.target_share||0, rs=p.rush_share||0;
  if(rs>=0.5) return '<span class="sig" style="color:'+C.turf+';background:'+C.turf+'1f;border:1px solid '+C.turf+'4d">Bellcow '+Math.round(rs*100)+'% carries</span>';
  if(ts>=0.22) return '<span class="sig" style="color:'+C.teal+';background:'+C.teal+'1f;border:1px solid '+C.teal+'4d">Target hog '+Math.round(ts*100)+'%</span>';
  return '';
}
function rzChip(p){
  if(!p.rz_share || p.rz_share<0.35) return '';
  return '<span class="sig" style="color:'+C.gold+';background:'+C.gold+'1f;border:1px solid '+C.gold+'4d">RZ role '+Math.round(p.rz_share*100)+'%</span>';
}
function consensusChip(p){
  if(p.p_topdown==null||p.p_bottomup==null) return '';
  if(Math.abs(p.p_topdown-p.p_bottomup)<=0.05 && p.p_final>=0.25)
    return '<span class="sig" style="color:'+C.volt+';background:'+C.volt+'1f;border:1px solid '+C.volt+'4d">✓ Model consensus</span>';
  return '';
}
function evChip(p){
  if(!p.has_market_odds || p.plus_ev_edge==null || p.plus_ev_edge<0.03) return '';
  return '<span class="sig" style="color:'+C.volt+';background:'+C.volt+'1f;border:1px solid '+C.volt+'4d">⚡ +EV '+(p.plus_ev_edge>=0?'+':'')+Math.round(p.plus_ev_edge*100)+'%</span>';
}
function limitedChip(p){
  if(p.has_track_record) return '';
  var label = p.confidence==='rookie' ? 'Rookie (role prior)' : p.confidence==='new_team' ? 'New team (role prior)' : 'Limited data';
  return '<span class="sig" style="color:'+C.n4+';background:'+C.n4+'1f;border:1px solid '+C.n4+'4d">'+label+'</span>';
}
function bumpChip(p){
  if(!p.roleBump) return '';
  return '<span class="sig" style="color:'+C.gold+';background:'+C.gold+'1f;border:1px solid '+C.gold+'4d">⬆ Role bump — in for '+esc(p.roleBump.outName)+'</span>';
}
function slotWeaponChip(p){
  if(!p.align || p.align.slot<0.45) return '';
  return '<span class="sig" style="color:'+C.teal+';background:'+C.teal+'1f;border:1px solid '+C.teal+'4d">Slot '+Math.round(p.align.slot*100)+'%</span>';
}
function boundaryChip(p){
  if(p.pos!=='WR' || !p.align || p.align.wide<0.75) return '';
  return '<span class="sig" style="color:'+C.n3+';background:'+C.n3+'1f;border:1px solid '+C.n3+'4d">Boundary '+Math.round(p.align.wide*100)+'%</span>';
}
function edgeBadge(p){
  // Surfaces the model-vs-market edge directly on the COLLAPSED card row --
  // previously this only appeared after tapping into the detail panel, even
  // though it's arguably the single most actionable number on the page.
  if(!p.has_market_odds || p.plus_ev_edge==null || p.plus_ev_edge<0.03) return '';
  return '<span class="edgebadge" style="color:'+C.volt+';background:'+C.volt+'22;border:1px solid '+C.volt+'66">⚡+'+Math.round(p.plus_ev_edge*100)+'%</span>';
}
function findStoryline(list){
  // The hero card always leads with the raw #1 projection (usually a
  // workhorse RB). This surfaces a second, different kind of story --
  // the week's biggest market disagreement, or its most notable
  // "next man up" bump -- so the page doesn't always look the same.
  var candidates = list.filter(function(p){return p.rank>1;});
  var bestEdge=null;
  candidates.forEach(function(p){
    if(p.has_market_odds && p.plus_ev_edge!=null && p.plus_ev_edge>=0.05 && (!bestEdge||p.plus_ev_edge>bestEdge.plus_ev_edge)) bestEdge=p;
  });
  if(bestEdge) return {player:bestEdge, type:'edge'};
  var bestBump=null, bestBumpSize=0;
  candidates.forEach(function(p){
    if(p.roleBump){
      var size=(p.roleBump.targetShareBump||0)+(p.roleBump.rushShareBump||0);
      if(size>bestBumpSize){ bestBumpSize=size; bestBump=p; }
    }
  });
  if(bestBump) return {player:bestBump, type:'bump'};
  return null;
}
function roofLabel(roof){
  if(roof==='dome'||roof==='closed') return '🏟️ Dome/Closed roof';
  if(roof==='outdoors'||roof==='open') return '🌤️ Outdoor';
  return 'Roof TBD';
}
function divChip(p){
  if(!p.divGame) return '';
  return '<span class="sig" style="color:'+C.red+';background:'+C.red+'1f;border:1px solid '+C.red+'4d">⚔️ Division game</span>';
}
function outcomeChip(p){
  if(p.actual_any_td==null){
    return p.kickoff ? '<span class="hit" style="color:'+C.n3+';background:'+C.n8+'">'+esc(p.kickoff)+'</span>' : '';
  }
  return p.actual_any_td
    ? '<span class="hit" style="color:#001428;background:'+C.turf+'">HIT</span>'
    : '<span class="hit" style="color:'+C.n4+';background:'+C.n8+'">MISS</span>';
}
function starBtn(p, abs){
  var on = state.watchlist.has(p.id);
  return '<button class="starbtn'+(abs?' abs':'')+(on?' on':'')+'" data-star="'+p.id+'" title="'+(on?'Remove from My Board':'Add to My Board')+'" aria-label="'+(on?'Remove from My Board':'Add to My Board')+'">'+(on?'★':'☆')+'</button>';
}
function miniShareBar(p){
  var ts=p.target_share, rs=p.rush_share;
  if(ts==null && rs==null) return '';
  var tsW = Math.round((ts||0)*100), rsW = Math.round((rs||0)*100);
  return '<div class="sharebar" title="Target share '+tsW+'% · Rush share '+rsW+'%">'+
    '<div class="sb-seg" style="width:'+tsW+'%;background:'+C.teal+'"></div>'+
    '<div class="sb-seg" style="width:'+rsW+'%;background:'+C.turf+'"></div>'+
    '</div>';
}
function gauge(p,size){
  var g=grade(p.p_final),frac=clamp(p.p_final,0,1);
  var r=size*.4,cx=size/2,cy=size*.56,sw=size*.09,start=160,sweep=220;
  function pol(deg){var a=deg*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];}
  function arc(f0,f1){var a0=start+sweep*f0,a1=start+sweep*f1,p0=pol(a0),p1=pol(a1);
    return 'M '+p0[0]+' '+p0[1]+' A '+r+' '+r+' 0 '+((a1-a0)>180?1:0)+' 1 '+p1[0]+' '+p1[1];}
  return '<div style="position:relative;width:'+size+'px;height:'+size*.78+'px;flex-shrink:0">'+
    '<svg width="'+size+'" height="'+(size*.78)+'" viewBox="0 0 '+size+' '+(size*.74)+'">'+
    '<path d="'+arc(0,1)+'" fill="none" stroke="'+C.n8+'" stroke-width="'+sw+'" stroke-linecap="round"/>'+
    '<path d="'+arc(0,1)+'" pathLength="100" fill="none" stroke="'+g[1]+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+(frac*100)+' 100"/>'+
    '</svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:'+size*.06+'px">'+
    '<b style="font-family:var(--font-display);font-weight:400;font-size:'+size*.24+'px;line-height:.9;color:#fff">'+pct(p.p_final)+'</b>'+
    '<span style="font-family:var(--font-data);font-size:'+size*.065+'px;letter-spacing:.08em;text-transform:uppercase;color:'+g[1]+';margin-top:2px">anytime TD</span></div></div>';
}
function bar(label,disp,frac,color){
  return '<div><div style="display:flex;justify-content:space-between;font-size:10.5px;color:'+C.n4+';margin-bottom:4px"><span>'+label+'</span><b style="color:#fff;font-family:var(--font-data);font-weight:600">'+disp+'</b></div>'+
    '<div style="height:5px;border-radius:999px;background:'+C.n8+';overflow:hidden"><div style="width:'+clamp(frac*100,0,100)+'%;height:100%;border-radius:999px;background:'+color+'"></div></div></div>';
}
function calibNote(p){
  // real decile calibration from this build's backtest (2023-2025, all completed seasons)
  var buckets=[
    [0,.047,'2.5% predicted -> 9.0% actually happened (this build\'s weakest range, mostly early-season cold-start weeks)'],
    [.047,.102,'roughly matched (6-9% predicted, 9-10% actual)'],
    [.102,.171,'well-calibrated (12-15% predicted tracks 12-16% actual)'],
    [.171,.265,'well-calibrated (19-24% predicted tracks 19-25% actual)'],
    [.265,.422,'well-calibrated (29-37% predicted tracks 28-34% actual)'],
    [.422,1,'52.1% predicted -> 49.6% actually happened (slightly high in this top range)']
  ];
  for(var i=0;i<buckets.length;i++){if(p.p_final>=buckets[i][0]&&p.p_final<buckets[i][1])return buckets[i][2];}
  return 'see the full calibration table';
}
function pct1(v){return v==null?'—':(Math.round(v*1000)/10)+'%';}
var ALIGN_BUCKET_LABEL = {slot:'slot receivers', boundary:'boundary/X receivers', inline:'in-line TEs', flex:'flex/mixed receivers'};
function alignMatchupHtml(p){
  // The offense-vs-defense comparison: bucket this player's own (real or projected)
  // alignment profile, then show how their Week 1 opponent has actually performed
  // against that exact bucket in real 2025 games -- a direct, apples-to-apples read
  // sitting right under the player's own alignment bars, not two disconnected numbers.
  if(!p.alignMatchup) return '';
  var m = p.alignMatchup;
  var bucketLabel = ALIGN_BUCKET_LABEL[p.alignBucket] || 'this alignment';
  var vulnerable = m.vsAvgIndex >= 1.15, tough = m.vsAvgIndex <= 0.85;
  var color = vulnerable ? C.turf : tough ? C.ketchup : C.n4;
  var verdict = vulnerable ? 'more exploitable than avg' : tough ? 'tougher than avg' : 'about average';
  return '<div style="margin-top:8px;display:flex;align-items:center;gap:12px;background:'+C.n8+';border:1px solid '+C.n6+';border-radius:8px;padding:9px 11px">'+
    '<div style="flex:1;min-width:0"><div style="font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:'+C.n5+'">'+esc(p.opp)+' vs '+bucketLabel+'</div>'+
    '<div style="margin-top:2px"><b style="font-family:var(--font-display);font-size:17px;font-weight:400;color:'+color+'">'+pct1(m.oppTdRate)+'</b> <span style="font-size:10px;color:'+C.n4+'">TD rate allowed</span></div></div>'+
    '<div style="text-align:right;flex-shrink:0"><div style="font-size:9px;color:'+C.n5+'">Lg avg '+pct1(m.leagueAvgTdRate)+'</div>'+
    '<div style="font-size:11px;font-weight:600;color:'+color+';margin-top:2px">#'+m.oppRank+' · '+verdict+'</div></div>'+
  '</div>';
}
function newsHtml(p){
  if(!p.rotowireUrl) return '';
  return '<a href="'+p.rotowireUrl+'" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:10px;text-decoration:none;background:linear-gradient(90deg,rgba(242,46,69,.10),#001428);border:1px solid '+C.n6+';border-radius:9px;padding:10px 12px">'+
    '<span style="width:30px;height:30px;border-radius:7px;background:'+C.red+'22;border:1px solid '+C.red+'55;display:grid;place-items:center;flex-shrink:0">'+
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="'+C.red+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7"/><path d="M10 14L21 3"/><path d="M21 14v5a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2h5"/></svg>'+
    '</span>'+
    '<span style="flex:1;min-width:0">'+
      '<span style="display:block;font-family:var(--font-data);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:'+C.n5+'">RotoWire</span>'+
      '<span style="display:block;font-weight:600;font-size:12.5px;color:#fff">Latest news &amp; player page</span>'+
    '</span>'+
    '<span style="color:'+C.n5+';font-size:13px;flex-shrink:0">↗</span>'+
  '</a>';
}
function detail(p){
  var blendHtml = (p.p_topdown==null || p.p_bottomup==null) ? '' :
    '<div><div class="dlbl">How this number is built</div>'+
      '<div style="display:grid;gap:8px">'+

      '</div></div>';

    '<div><div class="dlbl">Model v2 (Beta)</div>'+
      '<div style="display:grid;gap:8px">'+
        bar('Trained-model probability', pct(p.p_option_c), p.p_option_c, C.volt)+
      '</div></div>';
  var alignHtml = !p.align ? '' :
    '<div><div class="dlbl">Alignment profile <span style="font-weight:400;color:'+C.n5+'">'+(p.alignSource==='real'?'(2025 season)':'(projected — depth chart)')+'</span></div>'+
      '<div style="display:grid;gap:8px">'+
        bar('Out wide (boundary/X)', Math.round(p.align.wide*100)+'%', p.align.wide, C.n3)+

        (p.align.tight>0.02?bar('In-line (tight)', Math.round(p.align.tight*100)+'%', p.align.tight, C.gold):'')+
      '</div>'+
      alignMatchupHtml(p)+
    '</div>';
  var sigParts=[evChip(p),bumpChip(p),defTierChip(p),divChip(p),envChip(p),dueChip(p),hotChip(p),volumeChip(p),rzChip(p),slotWeaponChip(p),boundaryChip(p),consensusChip(p),limitedChip(p)].join('');
  var sigHtml = sigParts ? '<div style="display:flex;flex-wrap:wrap;gap:5px">'+sigParts+'</div>' : '';
  var envHtml = p.lambda_team==null ? '' :
    '<div><div class="dlbl">Game environment</div><div class="envgrid">'+
      '<div><i>Team TD projection</i><b>'+p.lambda_team.toFixed(2)+'</b></div>'+
      '<div><i>Vegas total</i><b>'+(p.total!=null?p.total:'—')+'</b></div>'+
      '<div><i>Site</i><b style="font-size:13px">'+(p.isHome?'Home':'Away')+'</b></div>'+
      '<div><i>Venue</i><b style="font-size:13px">'+roofLabel(p.roof)+'</b></div>'+
      '<div><i>Matchup type</i><b style="font-size:13px">'+(p.divGame?'Division game':'Non-division')+'</b></div>'+
    '</div></div>';
  var bumpHtml = !p.roleBump ? '' :
    '<div><div class="dlbl">Next man up</div><div style="font-size:11.5px;color:'+C.n3+';background:'+C.gold+'14;border:1px solid '+C.gold+'40;border-radius:8px;padding:10px 12px">'+
      'In for <b style="color:#fff">'+esc(p.roleBump.outName)+'</b> ('+esc(p.roleBump.outInjury||'')+', '+esc(p.roleBump.outStatus)+') · '+
      'target share +'+(p.roleBump.targetShareBump?Math.round(p.roleBump.targetShareBump*100):0)+'pt, rush share +'+(p.roleBump.rushShareBump?Math.round(p.roleBump.rushShareBump*100):0)+'pt'+
    '</div></div>';
  var defHtml = p.def_tier==null ? '' :
    '<div><div class="dlbl">Defensive matchup</div><div style="font-size:11.5px;color:'+C.n3+'">'+esc(p.opp)+' has allowed <b style="color:#fff">'+p.def_tds_allowed+'</b> TDs/game over their last 4 (trailing) · #'+p.def_rank+' most in the league · <b style="color:'+(DEFCOLOR[p.def_tier])+'">'+p.def_tier+'</b> defense</div></div>';
  var shareHtml = (p.target_share==null && p.rush_share==null && p.rz_share==null) ? '' :
    '<div><div class="dlbl">Opportunity profile (walk-forward, trailing)</div><div style="display:grid;gap:8px">'+

      (p.rush_share!=null?bar('Rush share',pct(p.rush_share),p.rush_share,C.turf):'')+
      (p.rz_share!=null?bar('Red-zone share (L4)',pct(p.rz_share),p.rz_share,C.gold):'')+
    '</div></div>';
  var dueHtml = (p.games_since_td==null || (p.games_since_td===0 && IS_SEASON_OPENER)) ? '' :

  var calib = p.has_market_odds
    ? (function(){
        var edge = p.plus_ev_edge, edgeUp = edge!=null && edge>=0;
        var edgeColor = edgeUp ? C.volt : C.n4;
        var books = (p.books||[]).slice().sort(function(a,b){return (b.price||-9999)-(a.price||-9999);});
        var booksHtml = books.length ? '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">'+
          books.map(function(b){
            var url = BOOK_URL[b.book];
            // Favorite vs. longshot color cue -- American odds aren't intuitive to
            // skim at a glance even for regular bettors, so a quick visual split

            // scanning speed across a row of 5-8 book chips.
            var priceColor = b.price==null ? C.n3 : b.price<0 ? C.teal : b.price>=300 ? C.gold : C.n3;
            var inner = '<span style="font-weight:600">'+esc(b.book)+'</span> <span style="font-family:var(--font-data);color:'+priceColor+'">'+americanFmt(b.price)+'</span>';
            return url
              ? '<a href="'+url+'" target="_blank" rel="noopener" class="sig" style="color:'+C.n3+';background:'+C.n8+';border:1px solid '+C.n6+';text-decoration:none;display:inline-flex;gap:5px;align-items:center">'+inner+' <span style="color:'+C.n5+'">↗</span></a>'
              : '<span class="sig" style="color:'+C.n3+';background:'+C.n8+';border:1px solid '+C.n6+'">'+inner+'</span>';
          }).join('') + '</div>' : '';
        return '<div><div class="dlbl">Market odds — Anytime TD ('+p.market_n_books+' book'+(p.market_n_books===1?'':'s')+')</div>'+
          '<div class="calib-box" style="background:rgba(0,212,170,.08);border-color:rgba(0,212,170,.3)">'+
            '<div style="flex:1;display:flex;gap:18px;align-items:baseline;flex-wrap:wrap">'+

            '</div></div>'+

        '</div>';
      })()
    : '<div><div class="dlbl">Backtested calibration (no market odds matched for this player)</div>'+

  var watchHtml = '<button class="watchbtn'+(state.watchlist.has(p.id)?' on':'')+'" data-star="'+p.id+'">'+
    (state.watchlist.has(p.id)?'★  On My Board — tap to remove':'☆  Add to My Board')+'</button>';
  return '<div class="detail">'+
    sigHtml +

function gameView(list){
  var byGame={};

      '<div style="padding:6px 4px">'+gl.map(function(p){

          avatar(p,26)+posBadge(p.pos)+
          '<b style="color:#fff;font-size:13px;flex:1;min-width:0;padding-right:30px">'+esc(p.name)+'</b>'+

  }).join('');
}
function fchip(k){
  var on = state.filters.has(k);
  return '<button class="fchip'+(on?' on':'')+'" data-filter="'+k+'">'+FILTERS[k].label+'</button>';
}
function filterBar(){
  var primaryChips = PRIMARY_FILTERS.map(fchip).join('');
  var watchChip = '<button class="fchip watch'+(state.onlyWatch?' on':'')+'" data-onlywatch="1">★ My Board ('+state.watchlist.size+')</button>';
  // Count how many non-primary filters are active, so the toggle itself hints
  // at hidden active state even while collapsed (rather than a plain label).
  var hiddenActive = 0;
  state.filters.forEach(function(k){ if(PRIMARY_FILTERS.indexOf(k)===-1) hiddenActive++; });
  var moreLabel = state.filtersExpanded ? 'Fewer filters ▲' : 'More filters'+(hiddenActive?' ('+hiddenActive+' on)':'')+' ▼';
  var moreBtn = '<button class="morefilters" data-morefilters="1">'+moreLabel+'</button>';
  var groupsHtml = !state.filtersExpanded ? '' :
    '<div class="moregroups">'+FILTER_GROUPS.map(function(g){
      return '<div class="filtergroup"><span class="filtergroup-lbl">'+g.label+'</span>'+g.keys.map(fchip).join('')+'</div>';
    }).join('')+'</div>';

    '<div class="filterrow">'+primaryChips+moreBtn+watchChip+'</div>'+
    groupsHtml+
  '</div>';
}
function render(){
  var head='<div class="head"><div class="brand">'+
    '<svg width="28" height="28" viewBox="0 0 134 134" fill="none" aria-hidden="true"><ellipse cx="21.9538" cy="111.068" rx="21.5612" ry="21.7233" fill="'+C.red+'"/><path d="M84.202 0.0207901C85.8707 0.0208411 88.1713 1.03856 89.2307 2.24585L125.003 43.1888C138.655 58.7464 134.091 72.5031 112.588 72.5031H98.0824C97.321 72.5031 96.8584 73.3425 97.265 73.9863L132.779 130.214C134.697 133.25 131.127 134.715 127.45 132.469L2.57136 58.3337C-0.11016 56.7418 -0.371784 54.188 2.14648 54.188H50.8101C52.5679 54.188 53.4139 52.0325 52.1254 50.8369L1.46572 3.82594C-0.739411 1.77964 -0.199344 0.0207914 2.63462 0.0207901H84.202Z" fill="'+C.red+'"/></svg>'+
    '<span class="wordmark"><small>Break the</small><b>PLANE</b></span></div>'+
    '<div class="badges"><span class="badge demo">LIVE PROJECTION</span><span class="badge week">WEEK '+DATA.week+' · '+DATA.season+'</span></div></div>';
  var list=DATA.players.filter(function(p){return state.pos==='All'||p.pos===state.pos;});
  state.filters.forEach(function(k){ if(FILTERS[k]) list = list.filter(FILTERS[k].test); });
  if(state.onlyWatch) list = list.filter(function(p){return state.watchlist.has(p.id);});
  if(state.search){
    var q = state.search.toLowerCase();
    list = list.filter(function(p){return p.name.toLowerCase().indexOf(q)>=0 || p.team.toLowerCase().indexOf(q)>=0;});
  }
  if(state.sort==='due') list=list.slice().sort(function(a,b){return (b.games_since_td||0)-(a.games_since_td||0);});
  else if(state.sort==='edge') list=list.slice().sort(function(a,b){
    var ae=(a.has_market_odds&&a.plus_ev_edge!=null)?a.plus_ev_edge:-999, be=(b.has_market_odds&&b.plus_ev_edge!=null)?b.plus_ev_edge:-999;
    return be-ae;
  });
  else if(state.sort==='rz') list=list.slice().sort(function(a,b){return (b.rz_share||0)-(a.rz_share||0);});
  else list=list.slice().sort(function(a,b){return a.rank-b.rank;});
  var hero=DATA.players[0];
  var heroHtml='<div class="hero"><div class="eyebrow">★ Top Projection, This Slate</div>'+
    '<div class="hero-row">'+avatar(hero,74)+
    '<span style="min-width:0;flex:1"><span style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:6px">'+
    '<span style="font-family:var(--font-display);font-size:12px;color:'+C.n5+'">#1</span>'+teamChip(hero.team)+posBadge(hero.pos)+gradePill(hero.p_final)+'</span>'+
    '<span class="hero-name" style="display:block">'+esc(hero.name)+'</span>'+
    '<span class="meta" style="margin-top:6px">'+(hero.isHome?'vs':'@')+' '+esc(hero.opp)+' <span>O/U '+hero.total+'</span><span style="color:'+C.n6+'">·</span><span>'+(hero.kickoff?esc(hero.kickoff):'Kickoff TBD')+'</span></span>'+
    '<span class="signals">'+defTierChip(hero)+envChip(hero)+dueChip(hero)+hotChip(hero)+'</span></span>'+
    gauge(hero,116)+'</div></div>';
  // A second, different kind of story below the hero -- the hero always leads
  // with the same "obvious workhorse" pick, so this surfaces whatever else is
  // most notable this week (a big market disagreement, or a role-bump story)
  // instead of the page looking identical every time someone opens it.
  var storyObj = findStoryline(DATA.players);
  var storylineHtml = !storyObj ? '' : (function(){
    var sp = storyObj.player;
    if(storyObj.type==='edge'){
      return '<div class="storyline"><span class="storytag">⚡ Market Mover</span>'+
        '<span class="storyname">'+esc(sp.name)+'</span><span class="storynote">model '+pct(sp.p_final)+' vs. market '+pct(sp.market_consensus)+
        ' — '+(sp.plus_ev_edge>=0?'+':'')+Math.round(sp.plus_ev_edge*100)+'% edge</span></div>';
    }
    return '<div class="storyline"><span class="storytag">⬆ Role Bump Watch</span>'+
      '<span class="storyname">'+esc(sp.name)+'</span><span class="storynote">projected up with '+esc(sp.roleBump.outName)+' out ('+esc(sp.roleBump.outStatus)+')</span></div>';
  })();
  var seg=function(opts,cur,attr){return '<span class="seg">'+opts.map(function(o){
    return '<button data-'+attr+'="'+o[0]+'" class="'+(o[0]===cur?'on':'')+'">'+o[1]+'</button>';}).join('')+'</span>';};
  var searchHtml = '<span class="searchwrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="'+C.n5+'" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.35-4.35"/></svg>'+
    '<input class="searchbox" id="searchInput" type="text" placeholder="Find a player…" value="'+esc(state.search)+'" aria-label="Search players by name or team" /></span>';
  var controls='<div class="controls">'+
    seg([['board','Big Board'],['table','Table'],['game','By Game']],state.view,'view')+
    seg([['All','All'],['RB','RB'],['WR','WR'],['TE','TE']],state.pos,'pos')+
    (state.view!=='game'?'<span class="sortlbl">Sort</span>'+seg([['rank','Model'],['edge','Edge'],['rz','RZ'],['due','Due']],state.sort,'sort'):'')+
    searchHtml+
    '<span class="count">'+list.length+' players</span></div>';
  var main = list.length===0
    ? '<div class="empty">No players match these filters right now — try clearing one above.</div>'
    : (state.view==='table' ? tableView(list) : state.view==='game' ? '<div style="padding-top:10px">'+gameView(list)+'</div>' : '<div class="list">'+list.map(card).join('')+'</div>');
  var foot='<div class="foot">Break the Plane · Research &amp; entertainment tool — not financial or betting advice.<br>'+
    'Gambling problem? Call/text <a href="tel:18004262537">1-800-GAMBLER</a>. Must be 21+ and in an eligible state to wager.</div>';
  root.innerHTML = '<div>'+head+heroHtml+storylineHtml+'<div class="stickywrap">'+controls+filterBar()+'</div>'+main+foot+'</div>';
}
// CMS/iframe embedding: when this page is loaded inside an iframe (e.g. a
// RotoWire CMS article), the parent frame has no way to know how tall our
// content is -- and it changes a lot: filters, expanded player cards, and
// the Board/Table/By Game view switch all change the real height. Report it
// on every render so a parent page can size its iframe to match instead of
// clipping or over-scrolling. No-ops harmlessly when not embedded (window.parent
// === window) and never throws if the parent frame rejects the message.
function reportHeightToParent(){
  if(window.parent === window) return;
  try{
    var h = Math.ceil(document.body.getBoundingClientRect().height);
    window.parent.postMessage({type:'btp:resize', source:'break-the-plane', height:h}, '*');
  }catch(e){}
}
function update(opts){
  // Wraps render() with scroll-position and search-input-focus preservation --
  // render() replaces the whole subtree's innerHTML, which would otherwise
  // reset scroll to 0 and drop keyboard focus out of the search box on every
  // keystroke or filter toggle.
  opts = opts || {};
  var scrollY = window.scrollY;
  var active = document.activeElement;
  var wasSearchFocused = active && active.id === 'searchInput';
  var selStart, selEnd;
  if(wasSearchFocused){ selStart = active.selectionStart; selEnd = active.selectionEnd; }
  render();
  if(wasSearchFocused){
    var inp = document.getElementById('searchInput');
    if(inp){ inp.focus(); try{ inp.setSelectionRange(selStart, selEnd); }catch(e){} }
  }
  reportHeightToParent();
  if(opts.scrollToExpanded && state.expanded){
    var el = document.querySelector('[data-toggle="'+state.expanded+'"]');
    if(el){ el.scrollIntoView({block:'center'}); return; }
  }
  window.scrollTo(0, scrollY);
}
root.addEventListener('click', function(ev){
  var el=ev.target;
  while(el && el!==root){
    if(el.dataset && el.dataset.star){
      var id=el.dataset.star;
      if(state.watchlist.has(id)) state.watchlist.delete(id); else state.watchlist.add(id);
      saveWatchlist(); update(); return;
    }
    if(el.dataset && el.dataset.filter){
      var k=el.dataset.filter;
      if(state.filters.has(k)) state.filters.delete(k); else state.filters.add(k);
      update(); return;
    }
    if(el.dataset && el.dataset.onlywatch){ state.onlyWatch=!state.onlyWatch; update(); return; }
    if(el.dataset && el.dataset.morefilters){ state.filtersExpanded=!state.filtersExpanded; update(); return; }
    if(el.dataset && el.dataset.toggle){state.expanded = state.expanded===el.dataset.toggle ? null : el.dataset.toggle; update(); return;}
    // View switches keep whatever card was expanded (rather than resetting it)
    // and scroll it back into view instead of jumping to the top of a new list --
    // losing your place when you're just changing how the same players are shown
    // read as broken. Position filters DO reset expanded, since that genuinely
    // changes the roster subset being shown.
    if(el.dataset && el.dataset.view){state.view=el.dataset.view; update({scrollToExpanded:true}); return;}
    if(el.dataset && el.dataset.pos){state.pos=el.dataset.pos; state.expanded=null; update(); return;}
    if(el.dataset && el.dataset.sort){state.sort=el.dataset.sort; update(); return;}
    el = el.parentNode;
  }
});
root.addEventListener('input', function(ev){
  if(ev.target && ev.target.id==='searchInput'){ state.search = ev.target.value; update(); }
});
// Belt-and-suspenders for the iframe height report: window resize (rotation,
// CMS column-width changes) and a ResizeObserver on the root (catches height
// changes from things like a CSS transition or webfont swap that aren't
// driven by our own update() calls) both re-report. Cheap and safe to run
// even when not embedded, since reportHeightToParent() no-ops in that case.
window.addEventListener('resize', reportHeightToParent);
if(window.ResizeObserver){
  try{ new ResizeObserver(reportHeightToParent).observe(root); }catch(e){}
}
update();

// Live market odds -- fetched client-side from this same Vercel deployment's
// /api/odds function (a same-origin port of the OpticOdds proxy that used to
// live on Val Town), so Market odds/+EV numbers refresh in the browser
// without waiting on the next full data-pipeline rebuild. Keys players by the
// same lowercase/accent-stripped/suffix-stripped name the odds function
// itself uses (see api/odds.ts) so the match is exact; anything that fails
// to match, errors, or the endpoint 500ing because ODDSJAM_KEY isn't set yet
// just leaves whatever market data (if any) was already baked into the
// export at build time -- a live-odds hiccup should never blank the board.
function normPlayerName(s){
  return String(s||'').trim().toLowerCase().normalize('NFD')
    .replace(/\p{Diacritic}/gu,'').replace(/\b(jr|sr|ii|iii|iv)\b/g,'')
    .replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();
}
function applyLiveOdds(payload){
  if(!payload || !payload.players) return false;
  var byName = {};
  DATA.players.forEach(function(p){ byName[normPlayerName(p.name)] = p; });
  var matched = 0;
  Object.keys(payload.players).forEach(function(k){
    var p = byName[k], o = payload.players[k];
    if(!p || o.consensus==null) return;
    p.has_market_odds = true;
    p.market_consensus = o.consensus;
    p.market_n_books = o.n;
    p.books = o.books || [];
    p.plus_ev_edge = p.p_final!=null ? (p.p_final - o.consensus) : null;
    matched++;
  });
  return matched > 0;
}
function fetchLiveOdds(){
  fetch('/api/odds', {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('odds http '+r.status);
    return r.json();
  }).then(function(payload){
    if(applyLiveOdds(payload)) update();
  }).catch(function(e){ /* stay on whatever market data was baked in at build time */ });
}
fetchLiveOdds();
setInterval(fetchLiveOdds, 3*60*1000); // matches api/odds.ts's own 3-minute cache window
</script>
